version: 1
name: software-change
inputs: [task]
agents:
  default-cloud: ../agents/default-cloud.yaml
  high-effort-cloud: ../agents/high-effort-cloud.yaml
  daybreak-cloud: ../agents/daybreak-cloud.yaml
  default-review: ../agents/default-review.yaml
entry: implement
stages:
  - id: implement
    type: agent
    agent: default-cloud
    inputs: [task]
    outputs: [candidate]
    prompt: Implement the delegated Rig task in this dedicated clone and run focused development checks. Report the changed files, actual checks and blockers. Leave changes uncommitted for the following service-owned local-commit check; the Codex sandbox intentionally protects Git metadata. Do not change Git metadata, push, publish a PR, or merge.
    next: local-commit
  - id: local-commit
    type: check
    inputs: [candidate]
    outputs: [candidate-commit]
    gate:
      command:
        - /usr/bin/python3
        - -I
        - -c
        - |
          import hashlib, json, os, pathlib, re, stat, subprocess, sys
          try:
              inputs = json.loads(os.environ["WORKSTREAM_INPUTS_JSON"])
              candidate = inputs["candidate"]
              assert isinstance(candidate, dict) and candidate.get("thread_id"), "missing candidate input"
              candidate_context = inputs.get("candidate_context")
              if candidate_context is not None:
                  assert isinstance(candidate_context, dict), "invalid candidate context claims"
                  assert set(candidate_context) == {"id", "repair_parent_sha", "validation_base"}, "invalid candidate context claims"
                  assert isinstance(candidate_context["id"], str) and re.fullmatch(r"[0-9a-f]{64}", candidate_context["id"]), "invalid candidate context id"
                  for name in ("repair_parent_sha", "validation_base"):
                      assert (
                          isinstance(candidate_context[name], str)
                          and re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", candidate_context[name])
                      ), "invalid candidate context Git SHA"
                  digest_input = {"candidate": candidate, "candidate_context": candidate_context}
              else:
                  digest_input = candidate
              digest = hashlib.sha256(json.dumps(digest_input, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              marker = "Factory-Candidate: " + digest
              root = pathlib.Path.cwd().resolve()
              gitdir = root / ".git"
              assert gitdir.is_dir() and not gitdir.is_symlink(), "dedicated Git required"
              assert not any((gitdir / name).exists() for name in ("commondir", "config.worktree", "objects/info/alternates")), "shared Git forbidden"
              assert not any(path.is_symlink() for path in gitdir.rglob("*")), "Git symlink forbidden"
              env = {"PATH": "/usr/bin:/bin", "HOME": "/nonexistent", "LC_ALL": "C", "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_SYSTEM": "/dev/null", "GIT_CONFIG_GLOBAL": "/dev/null", "GIT_TERMINAL_PROMPT": "0", "GIT_ATTR_NOSYSTEM": "1"}
              argv = ["/usr/bin/git", "--no-replace-objects", "--git-dir=" + str(gitdir), "--work-tree=" + str(root), "-c", "core.hooksPath=/dev/null", "-c", "core.fsmonitor=false", "-c", "core.attributesFile=/dev/null", "-c", "commit.gpgSign=false", "-c", "user.name=Rig Factory", "-c", "user.email=factory@rig.ai", "-c", "protocol.allow=never", "-c", "submodule.recurse=false"]
              def git(*args):
                  result = subprocess.run(argv + list(args), env=env, text=True, capture_output=True, timeout=25)
                  assert result.returncode == 0, "Git command failed: " + args[0] + ": " + result.stderr.strip()
                  return result.stdout.strip()
              def is_ancestor(ancestor, descendant):
                  result = subprocess.run(
                      argv + ["merge-base", "--is-ancestor", ancestor, descendant],
                      env=env,
                      text=True,
                      capture_output=True,
                      timeout=25,
                  )
                  assert result.returncode in (0, 1), "Git ancestry check failed: " + result.stderr.strip()
                  return result.returncode == 0
              names = git("config", "--file", str(gitdir / "config"), "--no-includes", "--name-only", "--list").splitlines()
              safe = re.compile(r"(?:core\.(?:repositoryformatversion|filemode|bare|logallrefupdates|ignorecase|precomposeunicode|hookspath|fsmonitor)|commit\.gpgsign|user\.(?:name|email)|extensions\.objectformat|remote\..+\.(?:url|fetch|pushurl)|branch\..+\.(?:remote|merge))")
              assert all(safe.fullmatch(name) for name in names), "unsupported Git configuration"
              assert git("rev-parse", "--is-bare-repository") == "false", "non-bare clone required"
              assert pathlib.Path(git("rev-parse", "--git-common-dir")).resolve() == gitdir, "shared Git directory"
              assert pathlib.Path(git("rev-parse", "--show-toplevel")).resolve() == root, "wrong root"
              branch = git("symbolic-ref", "--quiet", "HEAD")
              assert branch.startswith("refs/heads/"), "local branch required"
              head_before = git("rev-parse", "--verify", "HEAD^{commit}")
              prepared = marker in git("show", "--no-patch", "--format=%B", "HEAD").splitlines()
              if candidate_context is not None:
                  repair_parent = candidate_context["repair_parent_sha"]
                  validation_base = candidate_context["validation_base"]
                  assert (
                      git("rev-parse", "--verify", repair_parent + "^{commit}") == repair_parent
                  ), "repair parent is not an existing commit"
                  assert (
                      git("rev-parse", "--verify", validation_base + "^{commit}") == validation_base
                  ), "validation base is not an existing commit"
                  assert is_ancestor(validation_base, repair_parent), "validation base is not an ancestor of repair parent"
                  if prepared and head_before != repair_parent:
                      parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
                      assert len(parents) == 2 and parents[1] == repair_parent, "prepared candidate parent mismatch"
                  else:
                      prepared = False
                      assert head_before == repair_parent, "repair parent does not match branch head"
              if git("status", "--porcelain=v1"):
                  assert not prepared, "prepared candidate changed"
                  git("add", "--all", "--", ".")
                  assert git("diff", "--cached", "--name-only"), "no committable candidate changes"
                  git("commit", "--quiet", "--no-verify", "--no-gpg-sign", "--message", "Prepare local factory candidate\n\n" + marker)
              else:
                  assert prepared, "no candidate changes"
              assert not git("status", "--porcelain=v1"), "dirty candidate checkout"
              head = git("rev-parse", "--verify", "HEAD^{commit}")
              if candidate_context is not None:
                  parents = git("rev-list", "--parents", "-n", "1", head).split()
                  assert len(parents) == 2 and parents[1] == repair_parent, "candidate commit parent mismatch"
                  assert is_ancestor(validation_base, head), "validation base is not an ancestor of candidate"
                  base = repair_parent
              else:
                  base = git("rev-parse", "--verify", "HEAD^1^{commit}")
              bundle_dir = gitdir / "factory-candidates"
              bundle_dir.mkdir(mode=0o700, exist_ok=True)
              bundle = bundle_dir / (digest + ".bundle")
              if not bundle.exists():
                  git("bundle", "create", str(bundle), "HEAD", "^" + base)
              git("bundle", "verify", str(bundle))
              assert git("bundle", "list-heads", str(bundle)) == head + " HEAD", "bundle head mismatch"
              data = bundle.read_bytes()
              for path, mode, flags in ((bundle_dir, 0o750, os.O_DIRECTORY), (bundle, 0o640, 0)):
                  fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | flags)
                  try:
                      info = os.fstat(fd)
                      assert info.st_uid == os.getuid() and info.st_gid == os.getgid(), "bundle ownership mismatch"
                      assert flags or (stat.S_ISREG(info.st_mode) and info.st_nlink == 1), "unsafe bundle file"
                      os.fchmod(fd, mode)
                  finally:
                      os.close(fd)
              metadata = {
                  "candidate_commit": head,
                  "base_commit": base,
                  "candidate_input_sha256": digest,
                  "branch": branch,
                  "candidate_bundle": str(bundle.relative_to(root)),
                  "bundle_sha256": hashlib.sha256(data).hexdigest(),
                  "bundle_bytes": len(data),
              }
              if candidate_context is not None:
                  metadata.update({"candidate_context_id": candidate_context["id"], "repair_parent_sha": repair_parent, "validation_base": validation_base})
              print(json.dumps(metadata, sort_keys=True))
          except (AssertionError, KeyError, ValueError, OSError, subprocess.SubprocessError) as error:
              print("LOCAL_COMMIT_FAILED: " + str(error), file=sys.stderr)
              sys.exit(1)
      timeout_ms: 30000
      success: inspect-candidate
      failure: blocked
  - id: inspect-candidate
    type: check
    inputs: [candidate, candidate-commit]
    outputs: [candidate-inspection]
    gate:
      command: [sh, -c, 'git rev-parse --verify HEAD >/dev/null && test -z "$(git status --porcelain)"']
      timeout_ms: 10000
      success: validate
      failure: blocked
  - id: validate
    type: check
    inputs: [candidate, candidate-inspection, candidate-commit]
    outputs: [validation]
    gate:
      evaluator: candidate_validation
      required:
        - check: architecture-tests
          assertion: exit_status
          equals: 0
        - check: architecture-tests
          assertion: test_count
          equals: 1
      success: publish
      failure: blocked
  - id: publish
    type: publish
    inputs: [candidate, validation]
    outputs: [publication]
    gate:
      validation_stage: validate
      required:
        - check: architecture-tests
          assertion: exit_status
          equals: 0
        - check: architecture-tests
          assertion: test_count
          equals: 1
      success: github-validation
      failure: blocked
  - id: github-validation
    type: check
    inputs: [publication, validation]
    outputs: [github-validation]
    gate:
      evaluator: github_validation
      validation_stage: validate
      required:
        - check: architecture-tests
          assertion: exit_status
          equals: 0
        - check: architecture-tests
          assertion: test_count
          equals: 1
      success: prepare-review
      failure: blocked
  - id: prepare-review
    type: check
    inputs: [publication, github-validation]
    outputs: [review-checkout]
    gate:
      evaluator: review_checkout
      validation_stage: github-validation
      success: review
      failure: blocked
  - id: review
    type: agent
    agent: default-review
    review_checkout_stage: prepare-review
    inputs: [review-checkout]
    outputs: [review-result]
    prompt: Review the recorded committed PR diff in this separate checkout. Follow the pinned rubric exactly and return only its JSON as one final message. Do not edit, fix, publish, or merge. Review approval cannot replace executable validation.
    next: submit-review
  - id: submit-review
    type: check
    inputs: [review-checkout, review-result, publication, github-validation]
    outputs: [review-publication]
    gate:
      evaluator: review_publication
      validation_stage: github-validation
      checkout_stage: prepare-review
      review_stage: review
      success: candidate-ready
      failure:
        repair: implement
        max_attempts: 3
  - id: candidate-ready
    type: human_wait
    inputs: [publication, github-validation, review-publication]
    outputs: [answer]
    prompt: The exact validated candidate has one linked Rig PR, permanent evidence, and a submitted review for its current head. Human merge remains in GitHub; this reply completes only the configured workstream and does not authorize merging or cleanup.
    next: complete
